<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Portal — F&amp;F Web Systems</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F8; --surface:#FFFFFF; --surface-alt:#F0F1F4;
    --border:#E4E6EB; --text:#0F1117; --text-muted:#6B7280;
    --accent:#3548E0; --accent-soft:#EEF0FD; --success:#16A34A;
  }
  [data-theme="dark"]{
    --bg:#0A0C10; --surface:#12151C; --surface-alt:#181B24;
    --border:#232733; --text:#F7F8FA; --text-muted:#9299A6;
    --accent:#5B6EFF; --accent-soft:#1B2050; --success:#22C55E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    transition:background .2s,color .2s;
  }
  a{color:var(--accent);}

  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;width:100%;max-width:400px;}
  .login-card h1{font-size:20px;font-weight:700;margin-bottom:4px;letter-spacing:-0.02em;}
  .login-card .sub{font-size:13px;color:var(--text-muted);margin-bottom:24px;}
  label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;margin-top:14px;}
  input[type=text],input[type=password]{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface-alt);color:var(--text);font-size:14px;
  }
  button{cursor:pointer;font-family:inherit;}
  .btn-primary{margin-top:20px;width:100%;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:14px;}
  .btn-primary:hover{opacity:.9;}
  .error{color:#EF4444;font-size:13px;margin-top:10px;}
  .hidden{display:none !important;}
  .theme-toggle{position:fixed;top:20px;right:20px;display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;z-index:50;}
  .theme-toggle button{padding:6px 12px;border:none;border-radius:6px;background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;}
  .theme-toggle button.active{background:var(--accent);color:#fff;}

  @media(max-width:640px){
    .theme-toggle{
      position:static;margin:0 0 16px;align-self:flex-start;
    }
    #dashboard{padding-top:16px;}
  }

  #dashboard{max-width:1120px;margin:0 auto;padding:28px 24px 60px;}
  .dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  .dash-header h1{font-size:24px;font-weight:800;letter-spacing:-0.02em;}
  .dash-header .sub{font-size:13px;color:var(--text-muted);margin-top:2px;}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .logout-link{font-size:13px;color:var(--text-muted);cursor:pointer;}
  .logout-link:hover{color:var(--text);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;}

  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;}
  .stat-card .label{font-size:12px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .stat-card .value{font-size:22px;font-weight:800;}

  .stepper{display:flex;align-items:center;margin:6px 0 4px;}
  .step{flex:1;text-align:center;position:relative;}
  .step .dot{width:26px;height:26px;border-radius:50%;background:var(--surface-alt);border:2px solid var(--border);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-muted);}
  .step.done .dot{background:var(--accent);border-color:var(--accent);color:#fff;}
  .step .label{font-size:12px;color:var(--text-muted);}
  .step.done .label{color:var(--text);font-weight:600;}
  .step .line{position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border);z-index:-1;}
  .step.done .line{background:var(--accent);}
  .step:first-child .line{display:none;}

  .main-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px;}
  .stack{display:flex;flex-direction:column;gap:20px;}
  h2.card-title{font-size:15px;font-weight:700;margin-bottom:14px;}

  .upload-zone{border:2px dashed var(--border);border-radius:10px;padding:28px;text-align:center;font-size:13px;color:var(--text-muted);cursor:pointer;transition:border-color .15s;}
  .upload-zone:hover{border-color:var(--accent);}

  .file-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .file-row:last-child{border-bottom:none;}
  .file-row .fname{display:flex;align-items:center;gap:10px;}
  .file-icon{width:30px;height:30px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
  .file-meta{color:var(--text-muted);font-size:11px;}
  .file-row a{font-size:12px;font-weight:600;text-decoration:none;}
  .empty-state{font-size:13px;color:var(--text-muted);padding:20px 0;text-align:center;}

  .detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--text-muted);}
  .detail-row .v{font-weight:600;}

  .activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .activity-item:last-child{border-bottom:none;}
  .activity-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0;}
  .activity-text{font-size:13px;}
  .activity-time{font-size:11px;color:var(--text-muted);margin-top:2px;}

  @media(max-width:760px){
    .main-grid{grid-template-columns:1fr;}
    .stats-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="theme-toggle">
  <button id="themeLight" onclick="setTheme('light')">Light</button>
  <button id="themeDark" onclick="setTheme('dark')">Dark</button>
</div>

<div id="loginScreen">
  <div class="login-card">
    <h1>Client Portal</h1>
    <div class="sub">F&amp;F Web Systems</div>
    <label>Username</label>
    <input type="text" id="username">
    <label>Password</label>
    <input type="password" id="password">
    <button class="btn-primary" onclick="login()">Log in</button>
    <div class="error hidden" id="loginError"></div>
  </div>
</div>

<div id="dashboard" class="hidden">
  <div class="dash-header">
    <div>
      <h1 id="welcome">Welcome</h1>
      <div class="sub">Here's where your project stands</div>
    </div>
    <div class="header-actions">
      <span class="logout-link" onclick="logout()">Log out</span>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="label">Current Stage</div><div class="value" id="statStage">—</div></div>
    <div class="stat-card"><div class="label">Files Uploaded</div><div class="value" id="statFiles">0</div></div>
    <div class="stat-card"><div class="label">Client Since</div><div class="value" id="statSince">—</div></div>
  </div>

  <div class="card">
    <h2 class="card-title">Project Progress</h2>
    <div class="stepper" id="stepper"></div>
  </div>

  <div class="main-grid">
    <div class="stack">
      <div class="card">
        <h2 class="card-title">Upload Files</h2>
        <div class="upload-zone" id="dropZone">
          Click or drag a file here to upload
          <input type="file" id="fileInput" class="hidden">
        </div>
      </div>
      <div class="card">
        <h2 class="card-title">Your Files</h2>
        <div id="fileList"></div>
      </div>
    </div>

    <div class="stack">
      <div class="card">
        <h2 class="card-title">Project Details</h2>
        <div class="detail-row"><span class="k">Business</span><span class="v" id="detailBusiness">—</span></div>
        <div class="detail-row"><span class="k">Username</span><span class="v" id="detailUsername">—</span></div>
        <div class="detail-row"><span class="k">Email</span><span class="v" id="detailEmail">—</span></div>
        <div class="detail-row"><span class="k">Status</span><span class="v" id="detailStatus">—</span></div>
      </div>
      <div class="card">
        <h2 class="card-title">Recent Activity</h2>
        <div id="activityFeed"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "";
const STAGES = ['Design', 'Development', 'Review', 'Live'];

function setTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  document.getElementById('themeLight').classList.toggle('active', mode === 'light');
  document.getElementById('themeDark').classList.toggle('active', mode === 'dark');
  localStorage.setItem('portal-theme', mode);
}
setTheme(localStorage.getItem('portal-theme') || 'light');

async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  const res = await fetch(API + '/api/login', {
    method: 'POST', credentials: 'include',
    headers: {'content-type':'application/json'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error || 'Login failed'; errEl.classList.remove('hidden'); return; }
  enterDashboard();
}

async function enterDashboard() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  const meRes = await fetch(API + '/api/me', { credentials: 'include' });
  const me = await meRes.json();
  document.getElementById('welcome').textContent = me.business_name;
  document.getElementById('detailBusiness').textContent = me.business_name;
  document.getElementById('detailUsername').textContent = me.username;
  document.getElementById('detailEmail').textContent = me.email || '—';
  document.getElementById('detailStatus').textContent = STAGES[me.progress_stage] || '—';
  document.getElementById('statStage').textContent = STAGES[me.progress_stage] || '—';
  const since = me.created_at ? new Date(me.created_at).toLocaleDateString('en-US', {month:'short', year:'numeric'}) : '—';
  document.getElementById('statSince').textContent = since;
  renderStepper(me.progress_stage);
  loadFiles();
}

function renderStepper(currentStage) {
  const el = document.getElementById('stepper');
  el.innerHTML = STAGES.map((label, i) => `
    <div class="step ${i <= currentStage ? 'done' : ''}">
      <div class="line"></div>
      <div class="dot">${i <= currentStage ? '\u2713' : i + 1}</div>
      <div class="label">${label}</div>
    </div>
  `).join('');
}

async function logout() {
  await fetch(API + '/api/logout', { method: 'POST', credentials: 'include' });
  location.reload();
}

function fileExt(name) {
  const parts = name.split('.');
  return parts.length > 1 ? parts.pop().toUpperCase().slice(0,4) : 'FILE';
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr + 'Z').getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

async function loadFiles() {
  const res = await fetch(API + '/api/files', { credentials: 'include' });
  const data = await res.json();
  const files = data.files || [];

  document.getElementById('statFiles').textContent = files.length;

  const listEl = document.getElementById('fileList');
  listEl.innerHTML = files.length ? files.map(f => `
    <div class="file-row">
      <div class="fname">
        <div class="file-icon">${fileExt(f.filename)}</div>
        <div>
          <div>${f.filename}</div>
          <div class="file-meta">${formatSize(f.size_bytes)} · ${timeAgo(f.uploaded_at)}</div>
        </div>
      </div>
      <a href="${API}/api/files/${f.id}" target="_blank">Download</a>
    </div>
  `).join('') : '<div class="empty-state">No files uploaded yet</div>';

  const feedEl = document.getElementById('activityFeed');
  feedEl.innerHTML = files.length ? files.slice(0, 6).map(f => `
    <div class="activity-item">
      <div class="activity-dot"></div>
      <div>
        <div class="activity-text">Uploaded <strong>${f.filename}</strong></div>
        <div class="activity-time">${timeAgo(f.uploaded_at)}</div>
      </div>
    </div>
  `).join('') : '<div class="empty-state">No activity yet</div>';
}

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => uploadFile(fileInput.files[0]));
dropZone.addEventListener('dragover', e => e.preventDefault());
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
});

async function uploadFile(file) {
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  const originalText = dropZone.textContent;
  dropZone.textContent = 'Uploading...';
  await fetch(API + '/api/upload', { method: 'POST', credentials: 'include', body: form });
  dropZone.textContent = originalText;
  loadFiles();
}

(async () => {
  const res = await fetch(API + '/api/me', { credentials: 'include' });
  if (res.ok) enterDashboard();
})();
</script>

</body>
</html>
